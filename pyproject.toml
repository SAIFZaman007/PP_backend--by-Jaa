[project]
name = "peak-physique-backend"
version = "1.0.0"
description = "Peak Physique — FastAPI backend (auth, portals, bookings, payments, calendar, email)"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "pyjwt>=2.10.0",
    "pwdlib[bcrypt]>=0.2.1",
    "python-multipart>=0.0.12",
    "aiosmtplib>=3.0.2",
    "stripe>=11.1.0",
    "google-api-python-client>=2.151.0",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.1",
    "slowapi>=0.1.9",
    "httpx>=0.27.2",
    "pillow>=10.4.0",
    "a2wsgi",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI uses function calls (Depends) in defaults by design

[tool.pytest.ini_options]
asyncio_mode = "auto"